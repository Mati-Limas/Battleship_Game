<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <!-- Título do jogo -->
    <h1 class="titulo">Battleship</h1>

    <!-- Formulário do jogador -->
    <form class="formulario">
        <div>
            <label for="player">Name of the player:</label>
            <input type="text" id="player" name="player" placeholder="Enter your name">
        </div>
        <div>
            <label for="difficulty">Difficulty:</label>
            <select id="difficulty" name="difficulty">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>
        <button type="submit" class="btn_submit">Start the Game</button>
    </form>

    <footer>
        <p>Developed by Mateus Lirmann</p>
    </footer>

    <script src="JavaScript/main.js"></script>
    
</body>
</html>
